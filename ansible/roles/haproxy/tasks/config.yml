---
- include_tasks: precheck.yml

- name: Ensuring haproxy and keepalived directories exist
  file:
    path: "/etc/{{ item }}"
    state: "directory"
    mode: "0755"
  become: true
  loop:
    - haproxy
    - keepalived
  when: inventory_hostname in groups['haproxy']

- name: Ensuring kubernetes static pod manifests directory exists
  file:
    path: "{{ haproxy_manifest_dir }}"
    state: directory
    mode: "0755"
  become: true
  when: inventory_hostname in groups['haproxy']

# ---------------------------------------------------------------------------
# haproxy/keepalived 以静态 Pod 方式运行：manifest 渲染到 /etc/kubernetes/manifests
# 后，由 kubeadm init/join 的 kubelet-start 阶段拉起的 kubelet 统一加载，
# 无需在 init/join 前手工拉起 kubelet（历史方案存在 10250 端口冲突、
# drop-in 残留导致 kubelet 无法注册节点等问题，已废弃）。
# 时序：kubelet-start 先于 control-plane/etcd manifest 写入，keepalived/haproxy
# 更早可用，kubeadm wait-control-plane 及后续阶段走 controlPlaneEndpoint(VIP) 时
# VIP 已就绪；kubeadm 的 FileAvailable preflight 只检查自身 4 个 manifest 文件名，
# 与 pixiu-haproxy.yaml/pixiu-keepalived.yaml 不冲突。
# ---------------------------------------------------------------------------

# Allow haproxy to bind VIP before it is assigned.
- name: Setting sysctl values
  become: true
  sysctl: name={{ item.name }} value={{ item.value }} sysctl_set=yes
  loop:
    - { name: "net.ipv4.ip_forward", value: 1 }
    - { name: "net.ipv4.ip_nonlocal_bind", value: 1 }
  when: inventory_hostname in groups['haproxy']

- name: Copy keepalived confs
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Copy keepalived health check script
  template:
    src: check_haproxy.sh.j2
    dest: /etc/keepalived/check_haproxy.sh
    mode: "0755"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Copy haproxy confs
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
  become: true
  when: inventory_hostname in groups['haproxy']

# haproxy.cfg 为 hostPath 挂载，内容变化 kubelet 不感知；将 checksum 注入 manifest 注解，
# 配置一变 manifest 随之变化，由 kubelet 自行重建静态 Pod 加载新配置。
- name: Get haproxy config checksum
  stat:
    path: /etc/haproxy/haproxy.cfg
    checksum_algorithm: sha256
  register: haproxy_cfg_stat
  when: inventory_hostname in groups['haproxy']

- name: Deploy haproxy static pod manifest
  template:
    src: haproxy.yml.j2
    dest: "{{ haproxy_manifest_dir }}/pixiu-haproxy.yaml"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Deploy keepalived static pod manifest
  template:
    src: keepalived.yml.j2
    dest: "{{ haproxy_manifest_dir }}/pixiu-keepalived.yaml"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['haproxy']

---
- include_tasks: precheck.yml

- name: Set haproxy runtime facts
  set_fact:
    haproxy_runtime_type: "{{ 'docker' if inventory_hostname in (groups['docker-master'] | default([])) else 'containerd' }}"
    haproxy_kubelet_cgroup_driver: "{{ 'systemd' if inventory_hostname in (groups['docker-master'] | default([])) else 'cgroupfs' }}"
    haproxy_cri_socket: "{{ '' if inventory_hostname in (groups['docker-master'] | default([])) else 'unix:///run/containerd/containerd.sock' }}"
  when: inventory_hostname in groups['haproxy']

- name: Stop and mask systemd haproxy/keepalived if present
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - haproxy
    - keepalived
  failed_when: false
  when: inventory_hostname in groups['haproxy']

- name: Ensuring haproxy and keepalived directories exist
  file:
    path: "/etc/{{ item }}"
    state: "directory"
    mode: "0755"
  become: true
  loop:
    - haproxy
    - keepalived
  when: inventory_hostname in groups['haproxy']

- name: Ensuring kubernetes static pod manifests directory exists
  file:
    path: "{{ haproxy_manifest_dir }}"
    state: directory
    mode: "0755"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Ensuring kubelet state directory exists
  file:
    path: /var/lib/kubelet
    state: directory
    mode: "0755"
  become: true
  when: inventory_hostname in groups['haproxy']

# Allow haproxy to bind VIP before it is assigned.
- name: Setting sysctl values
  become: true
  sysctl: name={{ item.name }} value={{ item.value }} sysctl_set=yes
  loop:
    - { name: "net.ipv4.ip_forward", value: 1 }
    - { name: "net.ipv4.ip_nonlocal_bind", value: 1 }
  when: inventory_hostname in groups['haproxy']

- name: Copy keepalived confs
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"
  become: true
  when: inventory_hostname in groups['haproxy']
  notify:
    - Restart keepalived static pod

- name: Copy keepalived health check script
  template:
    src: check_haproxy.sh.j2
    dest: /etc/keepalived/check_haproxy.sh
    mode: "0755"
  become: true
  when: inventory_hostname in groups['haproxy']
  notify:
    - Restart keepalived static pod

- name: Copy haproxy confs
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
  become: true
  when: inventory_hostname in groups['haproxy']
  notify:
    - Restart haproxy static pod

- name: Pull haproxy and keepalived images
  shell: |
    set -e
    if [ "{{ haproxy_runtime_type }}" = "docker" ]; then
      docker pull {{ haproxy_image }}
      docker pull {{ keepalived_image }}
    else
      crictl pull {{ haproxy_image }}
      crictl pull {{ keepalived_image }}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: inventory_hostname in groups['haproxy']

- name: Check whether kubelet is already configured by kubeadm
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: haproxy_kubelet_conf
  when: inventory_hostname in groups['haproxy']

# Before kubeadm init, start kubelet with a minimal config so static pods can run.
- name: Bootstrap kubelet for HA static pods
  block:
    - name: Write bootstrap kubelet configuration
      template:
        src: kubelet-bootstrap-config.yaml.j2
        dest: "{{ haproxy_kubelet_config_path }}"
        mode: "0644"

    - name: Write kubeadm flags for container runtime
      template:
        src: kubeadm-flags.env.j2
        dest: /var/lib/kubelet/kubeadm-flags.env
        mode: "0644"
    - name: Ensure kubelet is started
      systemd:
        name: kubelet
        state: started
        enabled: true
  when:
    - inventory_hostname in groups['haproxy']
    - not haproxy_kubelet_conf.stat.exists

- name: Ensure kubelet is running for static pods
  systemd:
    name: kubelet
    state: started
    enabled: true
  when:
    - inventory_hostname in groups['haproxy']
    - haproxy_kubelet_conf.stat.exists

- name: Deploy haproxy static pod manifest
  template:
    src: haproxy.yml.j2
    dest: "{{ haproxy_manifest_dir }}/haproxy.yaml"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Deploy keepalived static pod manifest
  template:
    src: keepalived.yml.j2
    dest: "{{ haproxy_manifest_dir }}/keepalived.yaml"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['haproxy']

- name: Flush handlers
  meta: flush_handlers

- name: Wait for kubernetes VIP via haproxy static pods
  wait_for:
    host: "{{ kube_vip_address }}"
    port: "{{ kube_vip_port }}"
    timeout: 180
  when:
    - inventory_hostname in groups['haproxy']
  run_once: true

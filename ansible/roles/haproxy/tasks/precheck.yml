---
- name: Checking listen port for haproxy service
  debug:
    msg: >-
      启用 haproxy + keepalived（静态 Pod）时, kube_vip_port 不允许设置为 6443, 可编辑 /etc/kubez/globals.yml 进行修改, 推荐监听端口为 8443
  failed_when: true
  connection: local
  run_once: True
  when:
    - kube_vip_port == 6443
    - enable_haproxy | bool

- name: Checking haproxy hosts are kubernetes nodes (static pods need kubelet)
  debug:
    msg: >-
      静态 Pod 高可用要求 haproxy 组节点同时在 kube-master（或 kubernetes）组中，以便安装并启动 kubelet
  failed_when: true
  connection: local
  when:
    - enable_haproxy | bool
    - inventory_hostname in groups['haproxy']
    - inventory_hostname not in (groups['kube-master'] | default([]))
